name: Account Service CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: account_db
          POSTGRES_USER: account_user
          POSTGRES_PASSWORD: account_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U account_user -d account_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Step 1: Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Give Maven Wrapper execution permission
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Step 4: Compile, test and package the application
      - name: Build and test with Maven
        run: ./mvnw clean package

      # Step 5: Build Docker image
      - name: Build Docker image
        run: docker build -t account-service:${{ github.sha }} .