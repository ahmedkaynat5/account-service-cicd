name: Account Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Get the source code from the GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 17 on the GitHub Actions runner
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Give Maven Wrapper execution permission
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Step 4: Compile, test and package the Spring Boot application
      - name: Build and test with Maven
        run: ./mvnw clean package

      # Step 5: Build the Docker image
      - name: Build Docker image
        run: docker build -t account-service:${{ github.sha }} .